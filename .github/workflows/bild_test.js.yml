name: Build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_test:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout the code
      uses: actions/checkout@v4
    - name: Use node.js 24 
      uses: actions/setup-node@v4
      with:
          node-version: 24
          cache: 'npm'
    - name: Install dependencies
      run: npm install
    - name: Run test
      run: npm test

  deploy_to_render:
      needs: build_test
      runs-on: ubuntu-latest
      
      steps:
      - uses: JorgeLNJunior/render-deploy@v1.5.0
        with:
          service-id: ${{ secrets.SERVICE_ID }}
          api-key: ${{ secrets.API_KEY }}
          wait_deploy: true


